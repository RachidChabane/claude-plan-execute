<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>claude-plan-execute</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=DM+Sans:wght@300;400;500;600;700&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep: #06060b;
  --bg-base: #0a0a12;
  --bg-raised: #0f0f1a;
  --bg-surface: #141422;
  --bg-hover: #1a1a2e;
  --border-subtle: rgba(255,255,255,0.04);
  --border-dim: rgba(255,255,255,0.07);
  --border-visible: rgba(255,255,255,0.12);
  --text-primary: #e8e8f0;
  --text-secondary: rgba(232,232,240,0.55);
  --text-tertiary: rgba(232,232,240,0.3);
  --accent-green: #34d399;
  --accent-green-dim: rgba(52,211,153,0.12);
  --accent-amber: #fbbf24;
  --accent-amber-dim: rgba(251,191,36,0.1);
  --accent-red: #f87171;
  --accent-red-dim: rgba(248,113,113,0.1);
  --accent-blue: #60a5fa;
  --accent-blue-dim: rgba(96,165,250,0.08);
  --accent-violet: #a78bfa;
  --accent-violet-dim: rgba(167,139,250,0.08);
  --font-ui: 'DM Sans', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
}

html { font-size: 14px; }
body {
  font-family: var(--font-ui);
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Subtle grain texture */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
}

/* Layout */
.shell {
  display: grid;
  grid-template-columns: 300px 1fr;
  grid-template-rows: auto 1fr;
  min-height: 100vh;
}

/* Header */
.header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 28px;
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-base);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-mark {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  background: linear-gradient(135deg, var(--accent-violet), var(--accent-blue));
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  letter-spacing: -0.5px;
}

.logo-text {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.3px;
  color: var(--text-primary);
}

.logo-text span {
  color: var(--text-tertiary);
}

.connection-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-tertiary);
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border-subtle);
}

.connection-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-red);
  transition: background 0.3s;
}

.connection-dot.connected {
  background: var(--accent-green);
  box-shadow: 0 0 8px rgba(52,211,153,0.4);
  animation: pulse-green 2s ease-in-out infinite;
}

@keyframes pulse-green {
  0%, 100% { box-shadow: 0 0 4px rgba(52,211,153,0.3); }
  50% { box-shadow: 0 0 12px rgba(52,211,153,0.6); }
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Buttons */
.btn {
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 500;
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-dim);
  background: var(--bg-surface);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.btn:hover {
  background: var(--bg-hover);
  border-color: var(--border-visible);
  color: var(--text-primary);
}

.btn-primary {
  background: var(--accent-green);
  border-color: var(--accent-green);
  color: #06060b;
  font-weight: 600;
}

.btn-primary:hover {
  background: #4ade80;
  border-color: #4ade80;
  color: #06060b;
  box-shadow: 0 0 20px rgba(52,211,153,0.2);
}

.btn-primary:active {
  transform: scale(0.97);
}

.btn-danger {
  border-color: rgba(248,113,113,0.3);
  color: var(--accent-red);
}

.btn-danger:hover {
  background: var(--accent-red-dim);
  border-color: rgba(248,113,113,0.5);
}

.btn-sm { padding: 4px 8px; font-size: 11px; }

.btn-icon {
  width: 30px;
  height: 30px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
}

/* Sidebar */
.sidebar {
  background: var(--bg-base);
  border-right: 1px solid var(--border-subtle);
  padding: 20px 0;
  overflow-y: auto;
  height: calc(100vh - 53px);
  position: sticky;
  top: 53px;
}

.sidebar-section {
  padding: 0 16px;
  margin-bottom: 24px;
}

.sidebar-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-tertiary);
  padding: 0 12px;
  margin-bottom: 10px;
}

/* Form controls */
.field {
  margin-bottom: 14px;
}

.field-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 5px;
  display: block;
}

.field-input {
  width: 100%;
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-dim);
  background: var(--bg-deep);
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.15s;
}

.field-input:focus {
  border-color: rgba(96,165,250,0.4);
}

.field-select {
  appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23666' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 10px center;
  padding-right: 28px;
}

.field-row {
  display: flex;
  gap: 8px;
}

.field-row .field { flex: 1; }

/* Toggle */
.toggle-field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
}

.toggle {
  width: 36px;
  height: 20px;
  border-radius: 10px;
  background: var(--bg-deep);
  border: 1px solid var(--border-dim);
  position: relative;
  cursor: pointer;
  transition: all 0.2s;
}

.toggle.active {
  background: var(--accent-green-dim);
  border-color: rgba(52,211,153,0.4);
}

.toggle::after {
  content: '';
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--text-tertiary);
  position: absolute;
  top: 2px;
  left: 2px;
  transition: all 0.2s;
}

.toggle.active::after {
  left: 18px;
  background: var(--accent-green);
}

/* Range slider */
.range-wrapper {
  display: flex;
  align-items: center;
  gap: 10px;
}

.range-wrapper input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  height: 3px;
  border-radius: 2px;
  background: var(--border-dim);
  outline: none;
}

.range-wrapper input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent-blue);
  cursor: pointer;
  border: 2px solid var(--bg-deep);
}

.range-value {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--accent-blue);
  min-width: 16px;
  text-align: center;
}

/* Main content */
.main {
  padding: 24px 28px;
  overflow-y: auto;
  height: calc(100vh - 53px);
}

/* Running indicator */
.running-banner {
  display: none;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  background: var(--bg-surface);
  border: 1px solid var(--border-dim);
  border-radius: var(--radius-md);
  margin-bottom: 20px;
  animation: slideDown 0.3s ease;
}

.running-banner.visible { display: flex; }

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.running-spinner {
  width: 18px;
  height: 18px;
  border: 2px solid var(--border-dim);
  border-top-color: var(--accent-amber);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.running-info { flex: 1; }
.running-task {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
}
.running-phase {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--accent-amber);
  margin-top: 2px;
}
.running-elapsed {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 300;
  color: var(--text-secondary);
  letter-spacing: -0.5px;
  min-width: 70px;
  text-align: right;
}

/* Task list */
.task-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.task-card {
  background: var(--bg-raised);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  transition: all 0.15s ease;
  overflow: hidden;
}

.task-card:hover {
  border-color: var(--border-dim);
  background: var(--bg-surface);
}

.task-card.active {
  border-color: rgba(251,191,36,0.25);
  background: var(--bg-surface);
}

.task-card.done {
  opacity: 0.55;
}

.task-card.done:hover {
  opacity: 0.8;
}

.task-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
}

.task-id {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--text-tertiary);
  min-width: 24px;
}

.task-status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-tertiary);
  flex-shrink: 0;
  transition: all 0.3s;
}

.task-status-dot.pending { background: var(--text-tertiary); }
.task-status-dot.planning,
.task-status-dot.reviewing,
.task-status-dot.revising,
.task-status-dot.awaiting_human {
  background: var(--accent-amber);
  box-shadow: 0 0 8px rgba(251,191,36,0.4);
  animation: pulse-amber 1.5s ease-in-out infinite;
}
.task-status-dot.approved { background: var(--accent-blue); }
.task-status-dot.implementing {
  background: var(--accent-violet);
  box-shadow: 0 0 8px rgba(167,139,250,0.4);
  animation: pulse-violet 1.5s ease-in-out infinite;
}
.task-status-dot.done {
  background: var(--accent-green);
}
.task-status-dot.error {
  background: var(--accent-red);
}

@keyframes pulse-amber {
  0%, 100% { box-shadow: 0 0 4px rgba(251,191,36,0.3); }
  50% { box-shadow: 0 0 12px rgba(251,191,36,0.6); }
}
@keyframes pulse-violet {
  0%, 100% { box-shadow: 0 0 4px rgba(167,139,250,0.3); }
  50% { box-shadow: 0 0 12px rgba(167,139,250,0.6); }
}

.task-title {
  flex: 1;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Phase progress */
.task-phases {
  display: flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
}

.phase-pip {
  width: 28px;
  height: 3px;
  border-radius: 2px;
  background: var(--border-dim);
  transition: all 0.3s;
  position: relative;
}

.phase-pip.complete { background: var(--accent-green); }
.phase-pip.active {
  background: var(--accent-amber);
  animation: phase-glow 1.5s ease-in-out infinite;
}

@keyframes phase-glow {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}

.phase-pip::after {
  content: attr(data-label);
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  font-family: var(--font-mono);
  color: var(--text-tertiary);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.15s;
}

.task-card:hover .phase-pip::after { opacity: 1; }

.task-status-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  flex-shrink: 0;
}

.task-status-label.pending { color: var(--text-tertiary); background: transparent; }
.task-status-label.planning,
.task-status-label.reviewing,
.task-status-label.revising,
.task-status-label.awaiting_human { color: var(--accent-amber); background: var(--accent-amber-dim); }
.task-status-label.approved { color: var(--accent-blue); background: var(--accent-blue-dim); }
.task-status-label.implementing { color: var(--accent-violet); background: var(--accent-violet-dim); }
.task-status-label.done { color: var(--accent-green); background: var(--accent-green-dim); }

.task-expand-icon {
  color: var(--text-tertiary);
  transition: transform 0.2s;
  font-size: 16px;
  line-height: 1;
}

.task-card.expanded .task-expand-icon {
  transform: rotate(90deg);
}

/* Expanded task body */
.task-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}

.task-card.expanded .task-body {
  max-height: 2000px;
}

.task-body-inner {
  padding: 0 16px 16px 16px;
  border-top: 1px solid var(--border-subtle);
}

.task-description {
  font-size: 12px;
  line-height: 1.7;
  color: var(--text-secondary);
  margin: 12px 0;
  max-height: 120px;
  overflow-y: auto;
  white-space: pre-wrap;
  font-family: var(--font-mono);
  font-size: 11px;
}

.task-meta {
  display: flex;
  gap: 16px;
  margin: 10px 0;
  flex-wrap: wrap;
}

.task-meta-item {
  font-size: 11px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
}

.task-meta-item strong {
  color: var(--text-secondary);
  font-weight: 500;
}

.task-deps {
  display: flex;
  align-items: center;
  gap: 4px;
  margin: 8px 0;
}

.dep-chip {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--bg-deep);
  border: 1px solid var(--border-dim);
  color: var(--text-tertiary);
}

.task-actions {
  display: flex;
  gap: 6px;
  margin-top: 12px;
  flex-wrap: wrap;
}

/* Log panel */
.log-section {
  margin-top: 24px;
}

.log-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.log-title {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-tertiary);
}

.log-panel {
  background: var(--bg-deep);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  height: 260px;
  overflow-y: auto;
  padding: 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.6;
  color: var(--text-secondary);
}

.log-panel::-webkit-scrollbar { width: 4px; }
.log-panel::-webkit-scrollbar-track { background: transparent; }
.log-panel::-webkit-scrollbar-thumb { background: var(--border-dim); border-radius: 2px; }

.log-entry {
  padding: 2px 0;
  animation: logFade 0.3s ease;
}

@keyframes logFade {
  from { opacity: 0; transform: translateX(-4px); }
  to { opacity: 1; transform: translateX(0); }
}

.log-time { color: var(--text-tertiary); }
.log-info { color: var(--accent-blue); }
.log-success { color: var(--accent-green); }
.log-warn { color: var(--accent-amber); }
.log-error { color: var(--accent-red); }
.log-dim { color: var(--text-tertiary); }

/* Stats bar */
.stats-bar {
  display: flex;
  gap: 20px;
  padding: 14px 18px;
  background: var(--bg-raised);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  margin-bottom: 20px;
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.stat-value {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 300;
  letter-spacing: -0.5px;
}

.stat-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-tertiary);
}

.stat-value.green { color: var(--accent-green); }
.stat-value.amber { color: var(--accent-amber); }
.stat-value.dim { color: var(--text-tertiary); }

/* Empty / connecting states */
.connecting-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 300px;
  gap: 16px;
  color: var(--text-tertiary);
}

.connecting-state .running-spinner {
  width: 24px;
  height: 24px;
  border-width: 2px;
}

/* Scrollbar */
.sidebar::-webkit-scrollbar,
.main::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-track,
.main::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb,
.main::-webkit-scrollbar-thumb { background: var(--border-dim); border-radius: 2px; }

/* Animations */
.fade-in {
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.stagger > * {
  animation: staggerIn 0.3s ease both;
}
.stagger > *:nth-child(1) { animation-delay: 0.03s; }
.stagger > *:nth-child(2) { animation-delay: 0.06s; }
.stagger > *:nth-child(3) { animation-delay: 0.09s; }
.stagger > *:nth-child(4) { animation-delay: 0.12s; }
.stagger > *:nth-child(5) { animation-delay: 0.15s; }
.stagger > *:nth-child(6) { animation-delay: 0.18s; }
.stagger > *:nth-child(7) { animation-delay: 0.21s; }
.stagger > *:nth-child(8) { animation-delay: 0.24s; }
.stagger > *:nth-child(9) { animation-delay: 0.27s; }
.stagger > *:nth-child(10) { animation-delay: 0.30s; }

@keyframes staggerIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Tooltip */
[data-tooltip] {
  position: relative;
}
[data-tooltip]::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  padding: 4px 8px;
  border-radius: 4px;
  background: var(--bg-hover);
  border: 1px solid var(--border-dim);
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--text-secondary);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
}
[data-tooltip]:hover::after { opacity: 1; }

/* Allow the expanded body to scroll when the resolved-config <details>
   opens. Without this override, the existing max-height: 600px +
   overflow: hidden clips long audit tables. */
.task-card.expanded .task-body {
  overflow-y: auto;
}

/* Resolved config block */
.resolved-config-block {
  margin: 12px 0 8px;
  font-size: 11px;
  color: var(--text-secondary);
}
.resolved-config-block summary {
  cursor: pointer;
  user-select: none;
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-tertiary);
  padding: 4px 0;
  list-style: none;
}
.resolved-config-block summary::-webkit-details-marker { display: none; }
.resolved-config-block summary::before {
  content: "›";
  display: inline-block;
  margin-right: 6px;
  transition: transform 0.15s;
  color: var(--text-tertiary);
}
.resolved-config-block[open] summary::before { transform: rotate(90deg); }

.resolved-config-content {
  margin-top: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
}
.rcfg-table {
  width: 100%;
  border-collapse: collapse;
}
.rcfg-table th,
.rcfg-table td {
  padding: 4px 8px;
  text-align: left;
  border-bottom: 1px solid var(--border-subtle);
  vertical-align: top;
}
.rcfg-table th {
  font-weight: 500;
  color: var(--text-tertiary);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.rcfg-table td:first-child { color: var(--text-secondary); }
.rcfg-table td:nth-child(2) { color: var(--text-primary); }
.rcfg-table td:nth-child(3) { color: var(--text-tertiary); }

/* Provenance colour-coding */
.from-cli            { color: var(--accent-blue) !important; }
.from-task           { color: var(--accent-green) !important; }
.from-task-class     { color: var(--accent-violet) !important; }
.from-phase          { color: var(--accent-amber) !important; }
.from-project        { color: var(--text-secondary) !important; }
.from-hardcoded      { color: var(--text-tertiary) !important; }
.from-unset          { color: var(--accent-red) !important; font-style: italic; }

/* ── Services panel (T8) ── */
.services-panel {
  display: flex; flex-direction: column; gap: 8px;
  padding: 14px 18px;
  background: var(--bg-raised);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  margin-bottom: 20px;
}
.services-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
  color: var(--text-tertiary);
}
.service-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: var(--bg-deep);
}
.service-status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  background: var(--text-tertiary);
}
.service-status-dot.running   { background: var(--accent-green); }
.service-status-dot.stopped   { background: var(--text-tertiary); }
.service-status-dot.starting  { background: var(--accent-amber); }
.service-status-dot.crashed   { background: var(--accent-amber); }
.service-status-dot.unstable  { background: var(--accent-red); }
.service-name {
  font-family: var(--font-mono); font-size: 12px;
  color: var(--text-primary); flex: 1;
}
.service-meta {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-tertiary);
}
.service-actions { display: flex; gap: 6px; }
.service-log-toggle, .service-restart-btn {
  font-family: var(--font-mono); font-size: 10px;
  padding: 3px 8px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-dim); background: var(--bg-surface);
  color: var(--text-secondary); cursor: pointer;
}
.service-log-toggle:hover, .service-restart-btn:hover {
  background: var(--bg-hover); color: var(--text-primary);
}
.service-log-pane {
  display: none; padding: 8px 10px; margin-top: 6px;
  background: var(--bg-deep); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  font-family: var(--font-mono); font-size: 10px;
  white-space: pre-wrap; max-height: 240px; overflow-y: auto;
}
.service-log-pane.open { display: block; }

/* ── Aggregations panel (T12) ── */
.aggregations-panel {
  display: flex; flex-direction: column; gap: 12px;
  padding: 14px 18px;
  background: var(--bg-raised);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  margin-bottom: 20px;
}
.aggregations-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
  color: var(--text-tertiary);
}

.agg-card {
  background: var(--bg-deep);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
}
.agg-card-header {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 6px;
}
.agg-card-title {
  font-family: var(--font-mono); font-size: 12px;
  color: var(--text-primary);
}
.agg-card-meta {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-tertiary);
}
.agg-sparkline {
  display: block; width: 100%; height: 28px;
  margin: 6px 0 10px;
}
.agg-bar-list { display: flex; flex-direction: column; gap: 4px; }
.agg-bar-row {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 11px;
}
.agg-bar-label {
  flex: 1; min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
  color: var(--text-secondary);
}
.agg-bar-track {
  flex: 2; height: 6px;
  background: var(--bg-base); border-radius: 3px;
  overflow: hidden;
}
.agg-bar-fill {
  height: 100%; background: var(--accent-blue);
  border-radius: 3px;
}
.agg-bar-count {
  font-size: 10px; color: var(--text-tertiary);
  min-width: 24px; text-align: right;
}
.agg-empty {
  font-size: 11px; font-family: var(--font-mono);
  color: var(--text-tertiary); padding: 6px 0;
  font-style: italic;
}
.agg-truncated {
  font-size: 10px; font-family: var(--font-mono);
  color: var(--text-tertiary); padding: 6px 0 0;
}
.agg-error {
  font-size: 11px; color: var(--accent-red);
  font-family: var(--font-mono); padding: 6px 0;
}

/* ── Tab bar ── */
.task-tabs {
  display: flex;
  gap: 0;
  margin: 14px 0 0;
  border-bottom: 1px solid var(--border-subtle);
}

.task-tab {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 6px 14px;
  border: none;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--text-tertiary);
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: -1px;
}

.task-tab:hover { color: var(--text-secondary); }

.task-tab.active {
  color: var(--accent-blue);
  border-bottom-color: var(--accent-blue);
}

.task-tab-panel { display: none; padding-top: 10px; }
.task-tab-panel.active { display: block; }

/* ── Gates panel ── */
.gate-list { display: flex; flex-direction: column; gap: 4px; }

.gate-item {
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  overflow: hidden;
}

.gate-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  cursor: pointer;
  background: var(--bg-deep);
  user-select: none;
}

.gate-header:hover { background: var(--bg-hover); }

/* T10: Approve / Reject buttons appear inline with the gate header
   when status === 'awaiting_human'. Push them to the right of the
   gate-name + gate-size to keep the toggle icon at the far right. */
.gate-actions {
  display: flex;
  gap: 6px;
  margin-left: auto;
}
.gate-item.awaiting-human .gate-status-dot {
  background: var(--accent-amber);
  box-shadow: 0 0 8px rgba(251,191,36,0.4);
  animation: pulse-amber 1.5s ease-in-out infinite;
}

.gate-status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.gate-status-dot.pass    { background: var(--accent-green); }
.gate-status-dot.fail    { background: var(--accent-red); }
.gate-status-dot.unknown { background: var(--text-tertiary); }

.gate-name {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-secondary);
  flex: 1;
}

.gate-size {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-tertiary);
}

.gate-expand-icon {
  font-size: 14px;
  color: var(--text-tertiary);
  transition: transform 0.15s;
}
.gate-item.open .gate-expand-icon { transform: rotate(90deg); }

.gate-output {
  display: none;
  padding: 10px;
  background: var(--bg-deep);
  border-top: 1px solid var(--border-subtle);
}
.gate-item.open .gate-output { display: block; }

.gate-output pre {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-secondary);
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 300px;
  overflow-y: auto;
  line-height: 1.5;
}

/* ── Failures panel ── */
.failure-empty {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-tertiary);
  padding: 8px 0;
  font-style: italic;
}

.attempt-list { display: flex; flex-direction: column; gap: 6px; }

.attempt-item {
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.attempt-item.attempt-blocking { border-color: rgba(248,113,113,0.2); }

.attempt-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  cursor: pointer;
  background: var(--bg-deep);
  user-select: none;
}
.attempt-header:hover { background: var(--bg-hover); }

.attempt-number {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-tertiary);
  min-width: 20px;
}

.attempt-class {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 3px;
  background: var(--accent-red-dim);
  color: var(--accent-red);
  flex-shrink: 0;
}

.attempt-phase {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-tertiary);
}

.attempt-timestamp {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-tertiary);
  margin-left: auto;
}

.attempt-expand-icon {
  font-size: 14px;
  color: var(--text-tertiary);
  transition: transform 0.15s;
}
.attempt-item.open .attempt-expand-icon { transform: rotate(90deg); }

.attempt-body {
  display: none;
  padding: 10px;
  background: var(--bg-deep);
  border-top: 1px solid var(--border-subtle);
  font-family: var(--font-mono);
  font-size: 11px;
}
.attempt-item.open .attempt-body { display: block; }

.attempt-reason {
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 8px;
  white-space: pre-wrap;
}

.hypothesis-block {
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  background: rgba(96,165,250,0.06);
  border: 1px solid rgba(96,165,250,0.15);
  margin: 8px 0;
}
.hypothesis-label {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--accent-blue);
  margin-bottom: 4px;
}
.hypothesis-text {
  font-size: 11px;
  color: var(--text-secondary);
  line-height: 1.6;
  white-space: pre-wrap;
}

.attempt-verbatim summary {
  cursor: pointer;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-tertiary);
  list-style: none;
  padding: 4px 0;
  user-select: none;
}
.attempt-verbatim summary::-webkit-details-marker { display: none; }
.attempt-verbatim summary::before {
  content: "›";
  display: inline-block;
  margin-right: 6px;
  transition: transform 0.15s;
}
.attempt-verbatim[open] summary::before { transform: rotate(90deg); }

.attempt-verbatim pre {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-tertiary);
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 200px;
  overflow-y: auto;
  margin-top: 6px;
  line-height: 1.5;
}
</style>
</head>
<body>
<div class="shell">
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo">
        <div class="logo-mark">c</div>
        <div class="logo-text">claude-plan-execute</div>
      </div>
      <div class="connection-badge">
        <div class="connection-dot" id="connDot"></div>
        <span id="connLabel">Connecting...</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-danger btn-sm" id="btnStop" style="display:none" onclick="stopExecution()">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="2" y="2" width="8" height="8" rx="1" fill="currentColor"/></svg>
        Stop
      </button>
      <button class="btn btn-sm" onclick="resetAll()">Reset All</button>
      <button class="btn btn-primary" id="btnRunAll" onclick="runAll()">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 1.5L10.5 6L3 10.5V1.5Z" fill="currentColor"/></svg>
        Run All
      </button>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Configuration</div>
      <div class="field">
        <label class="field-label">Task File</label>
        <input class="field-input" id="cfgTaskFile" value="tasks.yaml" spellcheck="false">
      </div>
      <div class="field">
        <label class="field-label">Working Directory</label>
        <input class="field-input" id="cfgWorkDir" value="." spellcheck="false">
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">Model</label>
          <select class="field-input field-select" id="cfgModel">
            <option value="opus" selected>opus</option>
            <option value="sonnet">sonnet</option>
            <option value="haiku">haiku</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label">Effort</label>
          <select class="field-input field-select" id="cfgEffort">
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
            <option value="max" selected>max</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Review Rounds</label>
        <div class="range-wrapper">
          <input type="range" min="1" max="5" value="3" id="cfgReviewRounds" oninput="document.getElementById('rrVal').textContent=this.value">
          <span class="range-value" id="rrVal">3</span>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Test Command</label>
        <input class="field-input" id="cfgTestCmd" value="pytest" spellcheck="false" style="font-family:var(--font-mono)">
      </div>
      <div class="toggle-field">
        <label class="field-label" style="margin:0">Skip Permissions</label>
        <div class="toggle" id="cfgSkipPerms" onclick="this.classList.toggle('active')"></div>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Session</div>
      <div class="stat" style="padding:0 12px; margin-bottom:12px">
        <span class="stat-label">Elapsed</span>
        <span class="stat-value dim" id="sessionElapsed">00:00</span>
      </div>
      <div class="stat" style="padding:0 12px">
        <span class="stat-label">Invocations</span>
        <span class="stat-value dim" id="sessionInvocations">0</span>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <!-- Stats -->
    <div class="stats-bar fade-in">
      <div class="stat">
        <span class="stat-value green" id="statDone">0</span>
        <span class="stat-label">Done</span>
      </div>
      <div class="stat">
        <span class="stat-value amber" id="statActive">0</span>
        <span class="stat-label">Active</span>
      </div>
      <div class="stat">
        <span class="stat-value dim" id="statPending">0</span>
        <span class="stat-label">Pending</span>
      </div>
      <div class="stat" style="margin-left:auto">
        <span class="stat-value dim" id="statTotal">0</span>
        <span class="stat-label">Total</span>
      </div>
    </div>

    <!-- T2 §D11: Cost panel placeholder. Real visuals (bar chart,
         model breakdown, per-phase split) ship in T13. -->
    <div class="stats-bar fade-in" id="costPanel">
      <div class="stat">
        <span class="stat-value dim" id="costInput">0</span>
        <span class="stat-label">Input tokens</span>
      </div>
      <div class="stat">
        <span class="stat-value dim" id="costOutput">0</span>
        <span class="stat-label">Output tokens</span>
      </div>
      <div class="stat">
        <span class="stat-value dim" id="costCacheRead">0</span>
        <span class="stat-label">Cache read</span>
      </div>
      <div class="stat">
        <span class="stat-value dim" id="costCacheCreate">0</span>
        <span class="stat-label">Cache create</span>
      </div>
      <div class="stat">
        <span class="stat-value dim" id="costRuns">0</span>
        <span class="stat-label">Runs</span>
      </div>
      <div class="stat" style="margin-left:auto">
        <span class="stat-value dim" id="costSeconds">0</span>
        <span class="stat-label">Wall-clock s</span>
      </div>
    </div>

    <!-- T8: Services panel. Hidden when zero services declared. -->
    <div class="services-panel fade-in" id="servicesPanel" style="display:none">
      <div class="services-panel-header">
        <span>Services</span>
        <span class="service-meta" id="servicesCount">0</span>
      </div>
      <div id="servicesList"></div>
    </div>

    <!-- T12: Aggregations panel. Hidden when aggregations.yaml is
         absent or empty. Per-card data is fetched on init and
         re-fetched when a task transitions to 'done'. -->
    <div class="aggregations-panel fade-in" id="aggregationsPanel"
         style="display:none">
      <div class="aggregations-panel-header">
        <span>Aggregations</span>
        <span class="agg-card-meta" id="aggregationsCount">0</span>
      </div>
      <div id="aggregationsList"></div>
    </div>

    <!-- Running banner -->
    <div class="running-banner" id="runningBanner">
      <div class="running-spinner"></div>
      <div class="running-info">
        <div class="running-task" id="runningTask">—</div>
        <div class="running-phase" id="runningPhase">—</div>
      </div>
      <div class="running-elapsed" id="runningElapsed">00:00</div>
    </div>

    <!-- Task list -->
    <div class="task-list stagger" id="taskList">
      <div class="connecting-state" id="loadingState">
        <div class="running-spinner"></div>
        <span>Loading tasks...</span>
      </div>
    </div>

    <!-- Logs -->
    <div class="log-section">
      <div class="log-header">
        <span class="log-title">Live Output</span>
        <button class="btn btn-sm" onclick="clearLogs()">Clear</button>
      </div>
      <div class="log-panel" id="logPanel">
        <div class="log-entry log-dim">Waiting for connection...</div>
      </div>
    </div>
  </main>
</div>

<script>
const API = 'http://localhost:8420';
const WS_URL = 'ws://localhost:8420/ws';

let tasks = [];
let state = { tasks: {} };
let connected = false;
let ws = null;
let runningTimer = null;
let runningStart = null;
let sessionStart = null;
let invocationCount = 0;

// ── API helpers ──

async function api(path, opts = {}) {
  try {
    const r = await fetch(`${API}${path}`, {
      headers: { 'Content-Type': 'application/json' },
      ...opts,
    });
    if (!r.ok) throw new Error(`${r.status}`);
    return await r.json();
  } catch (e) {
    return null;
  }
}

// ── State management ──

async function fetchState() {
  const s = await api('/api/state');
  if (s) {
    state = s;
    updateUI();
    setConnected(true);
  } else {
    setConnected(false);
  }
}

async function fetchTasks() {
  const t = await api('/api/tasks');
  if (t) {
    tasks = t.tasks || t;
    renderTasks();
    setConnected(true);
  }
}

function setConnected(v) {
  connected = v;
  const dot = document.getElementById('connDot');
  const label = document.getElementById('connLabel');
  dot.classList.toggle('connected', v);
  label.textContent = v ? 'Connected' : 'Disconnected';
}

// ── Rendering ──

function renderTasks() {
  const list = document.getElementById('taskList');
  const loading = document.getElementById('loadingState');
  if (loading) loading.remove();

  list.innerHTML = '';
  tasks.forEach(task => {
    const ts = state.tasks?.[task.id] || { status: 'pending' };
    const status = ts.status || 'pending';
    const phases = getPhases(status);
    const deps = task.depends_on || [];

    const card = document.createElement('div');
    card.className = `task-card ${status === 'done' ? 'done' : ''} ${isActive(status) ? 'active' : ''}`;
    card.dataset.id = task.id;

    card.innerHTML = `
      <div class="task-header" onclick="toggleTask(${task.id})">
        <span class="task-id">#${task.id}</span>
        <div class="task-status-dot ${status}"></div>
        <span class="task-title">${esc(task.title)}</span>
        <div class="task-phases">
          <div class="phase-pip ${phases.plan}" data-label="plan"></div>
          <div class="phase-pip ${phases.review}" data-label="review"></div>
          <div class="phase-pip ${phases.impl}" data-label="implement"></div>
        </div>
        <span class="task-status-label ${status}">${status}</span>
        <span class="task-expand-icon">&#x203A;</span>
      </div>
      <div class="task-body">
        <div class="task-body-inner">
          ${deps.length ? `<div class="task-deps"><span style="font-size:10px;color:var(--text-tertiary);margin-right:4px">deps:</span>${deps.map(d => `<span class="dep-chip">#${d}</span>`).join('')}</div>` : ''}
          <div class="task-description">${esc(task.description || '').slice(0, 800)}${(task.description || '').length > 800 ? '...' : ''}</div>
          <div class="task-meta">
            ${task.commit_message ? `<span class="task-meta-item"><strong>commit:</strong> ${esc(task.commit_message)}</span>` : ''}
            ${ts.review_round ? `<span class="task-meta-item"><strong>review round:</strong> ${ts.review_round}</span>` : ''}
            ${ts.plan_path ? `<span class="task-meta-item"><strong>plan:</strong> ${esc(ts.plan_path)}</span>` : ''}
            ${ts.branch ? `<span class="task-meta-item"><strong>branch:</strong> ${esc(ts.branch)}</span>` : ''}
            ${ts.pr_url ? `<span class="task-meta-item"><strong>PR:</strong> <a href="${esc(ts.pr_url)}" target="_blank" rel="noopener">${esc(ts.pr_url)}</a></span>` : ''}
          </div>
          <div class="task-tabs">
            <button class="task-tab active" onclick="switchTab(${task.id}, 'config', this)">Config</button>
            <button class="task-tab" onclick="switchTab(${task.id}, 'gates', this)">Gates</button>
            <button class="task-tab" onclick="switchTab(${task.id}, 'failures', this)">Failures</button>
          </div>
          <div class="task-tab-panel active" data-tab="config" data-task-id="${task.id}">
            <div class="resolved-config-content"><em>Expand to load…</em></div>
          </div>
          <div class="task-tab-panel" data-tab="gates" data-task-id="${task.id}">
            <div class="gates-content"></div>
          </div>
          <div class="task-tab-panel" data-tab="failures" data-task-id="${task.id}">
            <div class="failures-content"></div>
          </div>
          <div class="task-actions">
            ${status !== 'done' ? `
              <button class="btn btn-sm btn-primary" onclick="runTask(${task.id})">
                <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M3 1.5L10.5 6L3 10.5V1.5Z" fill="currentColor"/></svg>
                Run
              </button>
              <button class="btn btn-sm" onclick="runTask(${task.id}, 'plan')">Plan only</button>
              <button class="btn btn-sm" onclick="runTask(${task.id}, 'review')">Review</button>
              <button class="btn btn-sm" onclick="runTask(${task.id}, 'implement')">Implement</button>
            ` : ''}
            <button class="btn btn-sm" onclick="resetTask(${task.id})">Reset</button>
          </div>
        </div>
      </div>
    `;
    list.appendChild(card);
  });

  updateStats();
}

function getPhases(status) {
  const map = {
    pending:        { plan: '', review: '', impl: '' },
    planning:       { plan: 'active', review: '', impl: '' },
    reviewing:      { plan: 'complete', review: 'active', impl: '' },
    revising:       { plan: 'complete', review: 'active', impl: '' },
    approved:       { plan: 'complete', review: 'complete', impl: '' },
    implementing:   { plan: 'complete', review: 'complete', impl: 'active' },
    awaiting_human: { plan: 'complete', review: 'complete', impl: 'active' },
    done:           { plan: 'complete', review: 'complete', impl: 'complete' },
  };
  return map[status] || map.pending;
}

function isActive(status) {
  return ['planning', 'reviewing', 'revising', 'implementing',
          'awaiting_human'].includes(status);
}

function fmtNum(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000)     return (n / 1_000).toFixed(1) + 'k';
  return String(n);
}

function updateCostPanel() {
  let input = 0, output = 0, cacheR = 0, cacheC = 0;
  let runs = 0, secs = 0;
  for (const tid in (state.tasks || {})) {
    const us = state.tasks[tid].usage_summary;
    if (!us) continue;
    input  += us.total_input_tokens   || 0;
    output += us.total_output_tokens  || 0;
    cacheR += us.total_cache_read     || 0;
    cacheC += us.total_cache_create   || 0;
    runs   += us.total_runs           || 0;
    secs   += us.duration_seconds     || 0;
  }
  document.getElementById('costInput').textContent       = fmtNum(input);
  document.getElementById('costOutput').textContent      = fmtNum(output);
  document.getElementById('costCacheRead').textContent   = fmtNum(cacheR);
  document.getElementById('costCacheCreate').textContent = fmtNum(cacheC);
  document.getElementById('costRuns').textContent        = runs;
  document.getElementById('costSeconds').textContent     = Math.round(secs);
}

function updateStats() {
  let done = 0, active = 0, pending = 0;
  tasks.forEach(t => {
    const s = state.tasks?.[t.id]?.status || 'pending';
    if (s === 'done') done++;
    else if (isActive(s)) active++;
    else pending++;
  });
  document.getElementById('statDone').textContent = done;
  document.getElementById('statActive').textContent = active;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statTotal').textContent = tasks.length;

  const hasActive = active > 0;
  document.getElementById('btnStop').style.display = hasActive ? 'flex' : 'none';
  document.getElementById('runningBanner').classList.toggle('visible', hasActive);

  if (hasActive) {
    const activeTask = tasks.find(t => isActive(state.tasks?.[t.id]?.status));
    if (activeTask) {
      const ts = state.tasks[activeTask.id];
      document.getElementById('runningTask').textContent = `Task ${activeTask.id}: ${activeTask.title}`;
      document.getElementById('runningPhase').textContent = ts.status;
      if (!runningStart) startRunTimer();
    }
  } else {
    stopRunTimer();
  }

  updateCostPanel();
}

function updateUI() {
  // Re-render status without full re-render
  tasks.forEach(task => {
    const card = document.querySelector(`.task-card[data-id="${task.id}"]`);
    if (!card) return;
    const ts = state.tasks?.[task.id] || { status: 'pending' };
    const status = ts.status || 'pending';
    const phases = getPhases(status);

    card.className = `task-card ${status === 'done' ? 'done' : ''} ${isActive(status) ? 'active' : ''} ${card.classList.contains('expanded') ? 'expanded' : ''}`;
    card.querySelector('.task-status-dot').className = `task-status-dot ${status}`;
    card.querySelector('.task-status-label').className = `task-status-label ${status}`;
    card.querySelector('.task-status-label').textContent = status;

    const pips = card.querySelectorAll('.phase-pip');
    pips[0].className = `phase-pip ${phases.plan}`;
    pips[1].className = `phase-pip ${phases.review}`;
    pips[2].className = `phase-pip ${phases.impl}`;
  });
  updateStats();

  document.querySelectorAll('.task-tab-panel[data-tab="failures"].active').forEach(panel => {
    const taskId = panel.dataset.taskId;
    if (taskId) renderFailuresPanel(taskId, panel);
  });

  document.querySelectorAll('.task-tab-panel[data-tab="gates"]').forEach(panel => {
    const taskId = panel.dataset.taskId;
    const ts = state.tasks?.[taskId] || {};
    if (isActive(ts.status)) {
      const content = panel.querySelector('.gates-content');
      if (content) delete content.dataset.loaded;
    }
  });
}

// ── Interactions ──

function toggleTask(id) {
  const card = document.querySelector(`.task-card[data-id="${id}"]`);
  if (!card) return;
  const wasExpanded = card.classList.contains('expanded');
  card.classList.toggle('expanded');
  if (!wasExpanded) {
    const configPanel = card.querySelector('.task-tab-panel[data-tab="config"]');
    if (configPanel) loadConfigPanel(id, configPanel);
  }
}

function switchTab(taskId, tabName, btnEl) {
  const card = document.querySelector(`.task-card[data-id="${taskId}"]`);
  if (!card) return;
  card.querySelectorAll('.task-tab').forEach(b => b.classList.remove('active'));
  card.querySelectorAll('.task-tab-panel').forEach(p => p.classList.remove('active'));
  btnEl.classList.add('active');
  const panel = card.querySelector(`.task-tab-panel[data-tab="${tabName}"]`);
  if (!panel) return;
  panel.classList.add('active');
  if (tabName === 'config')   loadConfigPanel(taskId, panel);
  if (tabName === 'gates')    loadGatesPanel(taskId, panel);
  if (tabName === 'failures') renderFailuresPanel(taskId, panel);
}

async function loadConfigPanel(taskId, panelEl) {
  const content = panelEl.querySelector('.resolved-config-content');
  if (!content || content.dataset.loaded === '1') return;
  content.innerHTML = '<em>Loading…</em>';
  const data = await api(`/api/resolved-config/${encodeURIComponent(taskId)}`);
  if (!data || data.error) {
    content.innerHTML = '<em>Not yet generated. Run the task to produce it.</em>';
    return;
  }
  let rows = '';
  for (const [key, info] of Object.entries(data)) {
    const fromLabel = String(info.from || 'unset');
    const rawKind = fromLabel.split(':')[0];
    const fromKind = (rawKind === 'project_defaults' ? 'project' : rawKind).replace(/_/g, '-');
    const valueText = (info.value === null || info.value === undefined)
      ? '<em>null</em>'
      : esc(typeof info.value === 'string' ? info.value : JSON.stringify(info.value));
    rows += `<tr>
      <td>${esc(key)}</td>
      <td>${valueText}</td>
      <td class="from-${fromKind}">${esc(fromLabel)}</td>
    </tr>`;
  }
  content.innerHTML = `
    <table class="rcfg-table">
      <thead><tr><th>key</th><th>value</th><th>from</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  content.dataset.loaded = '1';
}

function gateStatus(taskId, gateName) {
  const ts = state.tasks?.[String(taskId)] || {};
  if (ts.status === 'done') return 'pass';
  for (const a of (ts.attempts || [])) {
    if (a.artifacts?.[`gate:${gateName}`]) return 'fail';
  }
  return 'unknown';
}

async function loadGatesPanel(taskId, panelEl) {
  const content = panelEl.querySelector('.gates-content');
  if (!content || content.dataset.loaded === '1') return;
  content.innerHTML = '<em>Loading…</em>';
  const data = await api(`/api/gates/${encodeURIComponent(taskId)}`);
  if (!data) {
    content.innerHTML = '<em>Could not load gate data.</em>';
    return;
  }
  if (!data.gates || data.gates.length === 0) {
    content.innerHTML = '<span class="failure-empty">No gate output files found.</span>';
    content.dataset.loaded = '1';
    return;
  }
  // T10 §D16: render Approve/Reject buttons inline with the named
  // gate item when state.tasks[tid].status === 'awaiting_human' AND
  // awaiting_gate_name matches. The kind=='awaiting_human' field on
  // the gate listing entry is a secondary signal for client-side
  // correctness when the list arrives before the state update.
  const ts = state.tasks?.[String(taskId)] || {};
  const items = data.gates.map(g => {
    const isPending = (
      (ts.status === 'awaiting_human' && ts.awaiting_gate_name === g.name)
      || g.kind === 'awaiting_human'
    );
    const actions = isPending ? `
      <div class="gate-actions">
        <button class="btn btn-sm btn-primary"
                onclick="event.stopPropagation(); approveGate(${taskId}, '${g.name}')">
          Approve
        </button>
        <button class="btn btn-sm"
                onclick="event.stopPropagation(); rejectGate(${taskId}, '${g.name}')">
          Reject
        </button>
      </div>` : '';
    const placeholder = isPending
      ? `<pre><em>Awaiting decision…</em></pre>`
      : `<pre><em>Loading…</em></pre>`;
    return `
    <div class="gate-item ${isPending ? 'awaiting-human' : ''}" id="gate-${taskId}-${g.name}">
      <div class="gate-header" onclick="toggleGate(${taskId}, '${g.name}')">
        <div class="gate-status-dot ${gateStatus(taskId, g.name)}"></div>
        <span class="gate-name">${esc(g.name)}</span>
        <span class="gate-size">${g.size}b</span>
        ${actions}
        <span class="gate-expand-icon">&#x203A;</span>
      </div>
      <div class="gate-output" data-task-id="${taskId}" data-gate-name="${esc(g.name)}">
        ${placeholder}
      </div>
    </div>`;
  }).join('');
  content.innerHTML = `<div class="gate-list">${items}</div>`;
  content.dataset.loaded = '1';
}

// T10 §D16: Approve / Reject helpers — POST to the new
// /api/gates/{tid}/{name}/decision endpoint. The operator's note is
// gathered via prompt(...); empty notes are allowed (the body sends
// the empty string, server side caps to 4 KB).
async function approveGate(taskId, gateName) {
  const note = prompt(`Approve "${gateName}" — optional note:`) || '';
  const r = await api(
    `/api/gates/${encodeURIComponent(taskId)}/${encodeURIComponent(gateName)}/decision`,
    {
      method: 'POST',
      body: JSON.stringify({ decision: 'approve', note }),
    },
  );
  if (r && r.ok) {
    addLog('success', `Approved ${gateName}${note ? `: ${note}` : ''}`);
  } else {
    addLog('error', `Failed to approve ${gateName}`);
  }
}

async function rejectGate(taskId, gateName) {
  const note = prompt(`Reject "${gateName}" — optional note:`) || '';
  const r = await api(
    `/api/gates/${encodeURIComponent(taskId)}/${encodeURIComponent(gateName)}/decision`,
    {
      method: 'POST',
      body: JSON.stringify({ decision: 'reject', note }),
    },
  );
  if (r && r.ok) {
    addLog('warn', `Rejected ${gateName}${note ? `: ${note}` : ''}`);
  } else {
    addLog('error', `Failed to reject ${gateName}`);
  }
}

function toggleGate(taskId, gateName) {
  const item = document.getElementById(`gate-${taskId}-${gateName}`);
  if (!item) return;
  item.classList.toggle('open');
  if (item.classList.contains('open')) {
    loadGateOutput(taskId, gateName, item.querySelector('.gate-output'));
  }
}

async function loadGateOutput(taskId, gateName, outputEl) {
  if (!outputEl || outputEl.dataset.loaded === '1') return;
  const data = await api(`/api/gates/${encodeURIComponent(taskId)}/${encodeURIComponent(gateName)}`);
  if (!data || data.error) {
    outputEl.innerHTML = '<pre><em>Could not load output.</em></pre>';
    return;
  }
  outputEl.innerHTML = `<pre>${esc(data.content)}</pre>`;
  outputEl.dataset.loaded = '1';
}

function renderFailuresPanel(taskId, panelEl) {
  const content = panelEl.querySelector('.failures-content');
  if (!content) return;
  const ts = state.tasks?.[String(taskId)] || {};
  const attempts = ts.attempts || [];
  if (attempts.length === 0) {
    content.innerHTML = '<span class="failure-empty">No failures recorded.</span>';
    return;
  }
  content.innerHTML = `<div class="attempt-list">${attempts.map((a, i) => `
    <div class="attempt-item attempt-blocking">
      <div class="attempt-header" onclick="toggleAttempt(this.parentElement)">
        <span class="attempt-number">#${i + 1}</span>
        <span class="attempt-class">${esc(a.failure_class || 'unknown')}</span>
        <span class="attempt-phase">${esc(a.phase || '')}</span>
        <span class="attempt-timestamp">${esc((a.timestamp || '').replace('T', ' ').slice(0, 19))}</span>
        <span class="attempt-expand-icon">&#x203A;</span>
      </div>
      <div class="attempt-body">
        <div class="attempt-reason">${esc(a.reason || '')}</div>
        ${a.hypothesis ? `
          <div class="hypothesis-block">
            <div class="hypothesis-label">Hypothesis</div>
            <div class="hypothesis-text">${esc(a.hypothesis)}</div>
          </div>` : ''}
        ${a.verbatim ? `
          <details class="attempt-verbatim">
            <summary>Verbatim output</summary>
            <pre>${esc(a.verbatim)}</pre>
          </details>` : ''}
      </div>
    </div>`).join('')}</div>`;
}

function toggleAttempt(itemEl) {
  itemEl.classList.toggle('open');
}

async function runAll() {
  addLog('info', 'Starting all tasks...');
  sessionStart = Date.now();
  startSessionTimer();
  await api('/api/run', { method: 'POST', body: JSON.stringify({
    model: document.getElementById('cfgModel').value,

async function runTask(id, skipTo) {

async function stopExecution() {

async function resetTask(id) {

  addLog('info', `Task ${id} reset`);
  await fetchState();
  renderTasks();
}

async function resetAll() {
  await api('/api/reset', { method: 'POST', body: JSON.stringify({}) });
  addLog('info', 'All tasks reset');
  await fetchState();
  renderTasks();
}

// ── Timers ──

function startRunTimer() {
  runningStart = Date.now();
  if (runningTimer) clearInterval(runningTimer);
  runningTimer = setInterval(() => {
    document.getElementById('runningElapsed').textContent = fmtElapsed(Date.now() - runningStart);
  }, 1000);
}

function stopRunTimer() {
  if (runningTimer) clearInterval(runningTimer);
  runningTimer = null;
  runningStart = null;
}

let sessionTimer = null;
function startSessionTimer() {
  if (sessionTimer) clearInterval(sessionTimer);
  sessionTimer = setInterval(() => {
    if (sessionStart) {
      document.getElementById('sessionElapsed').textContent = fmtElapsed(Date.now() - sessionStart);
    }
  }, 1000);
}

function fmtElapsed(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  if (h > 0) return `${h}:${String(m % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  return `${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}

// ── Logging ──

function addLog(type, message) {
  const panel = document.getElementById('logPanel');
  const now = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const entry = document.createElement('div');
  entry.className = `log-entry log-${type}`;
  entry.innerHTML = `<span class="log-time">${now}</span> ${esc(message)}`;
  panel.appendChild(entry);
  panel.scrollTop = panel.scrollHeight;

  if (type === 'info' || type === 'success') invocationCount++;
  document.getElementById('sessionInvocations').textContent = invocationCount;
}

function clearLogs() {
  document.getElementById('logPanel').innerHTML = '';
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ── WebSocket ──

function connectWS() {
  try {
    ws = new WebSocket(WS_URL);
    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'log') addLog(msg.level || 'info', msg.message);
        if (msg.type === 'state') {
          state = msg.data; updateUI();
          // T12: re-fetch aggregations when a new task completes.
          const doneCount = Object.values(state.tasks || {})
            .filter(t => t.status === 'done').length;
          if (doneCount !== lastDoneCount) {
            lastDoneCount = doneCount;
            fetchAggregations();
          }
        }
      } catch {
        addLog('dim', e.data);
      }
    };
    ws.onclose = () => {
      setConnected(false);
      setTimeout(connectWS, 3000);
    };
    ws.onerror = () => ws.close();
  } catch {
    setTimeout(connectWS, 3000);
  }
}

async function fetchServices() {

}

        <div class="service-meta">${esc(meta)}</div>

      <pre class="service-log-pane"

function toggleServiceLog(name) {

async function restartService(name) {

            { method: 'POST', body: JSON.stringify({}) });
  await fetchServices();
}

// ── T12: Aggregations panel ──

const AGG_TOP_N = 10;
let lastDoneCount = 0;

async function fetchAggregations() {
  const list = await api('/api/aggregations');
  if (!list || !Array.isArray(list.aggregations)) return;
  const panel = document.getElementById('aggregationsPanel');
  const listEl = document.getElementById('aggregationsList');
  const count = document.getElementById('aggregationsCount');
  if (list.aggregations.length === 0) {
    panel.style.display = 'none';
    return;
  }
  panel.style.display = '';
  count.textContent = String(list.aggregations.length);

  // Render placeholder cards immediately, then populate each.
  listEl.innerHTML = list.aggregations.map(a => `
    <div class="agg-card" id="agg-card-${esc(a.name)}">
      <div class="agg-card-header">
        <span class="agg-card-title">${esc(a.name)}</span>
        <span class="agg-card-meta">${esc(a.gate)} · ${esc(a.mode)}</span>
      </div>
      <div class="agg-card-body"><em>Loading…</em></div>
    </div>
  `).join('');

  await Promise.all(list.aggregations.map(a => fetchOneAggregation(a.name)));
}

async function fetchOneAggregation(name) {
  const card = document.getElementById(`agg-card-${name}`);
  if (!card) return;
  const body = card.querySelector('.agg-card-body');
  const data = await api(`/api/aggregate/${encodeURIComponent(name)}`);
  if (!data || data.error) {
    body.innerHTML = `<div class="agg-error">${esc(data?.error || 'Could not load')}</div>`;
    return;
  }
  body.innerHTML = renderAggregationBody(data);
}

function renderAggregationBody(data) {
  const rows = data.rows || [];
  if (rows.length === 0) {
    return '<div class="agg-empty">No findings yet.</div>';
  }
  const sparkline = renderSparkline(buildSparklineData(rows));
  const top = rows.slice(0, AGG_TOP_N);
  const max = top[0].total_count || 1;
  const bars = top.map(r => {
    const pct = Math.max(2, Math.round(100 * r.total_count / max));
    const tip = Object.entries(r.per_task)
      .map(([tid, n]) => `task ${tid}: ${n}`).join(' · ');
    return `
      <div class="agg-bar-row" data-tooltip="${esc(tip)}">
        <span class="agg-bar-label">${esc(r.finding)}</span>
        <span class="agg-bar-track">
          <span class="agg-bar-fill" style="width:${pct}%"></span>
        </span>
        <span class="agg-bar-count">${r.total_count}</span>
      </div>`;
  }).join('');
  const more = rows.length > AGG_TOP_N
    ? `<div class="agg-truncated">+ ${rows.length - AGG_TOP_N} more</div>`
    : '';
  return `${sparkline}<div class="agg-bar-list">${bars}</div>${more}`;
}

function buildSparklineData(rows) {
  const totals = {};
  for (const row of rows) {
    for (const [tid, n] of Object.entries(row.per_task)) {
      totals[tid] = (totals[tid] || 0) + n;
    }
  }
  const tids = Object.keys(totals).sort((a, b) => {
    const aNum = /^\d+$/.test(a), bNum = /^\d+$/.test(b);
    if (aNum && bNum) return parseInt(a) - parseInt(b);
    if (aNum !== bNum) return aNum ? -1 : 1;
    return a.localeCompare(b);
  });
  return tids.map(t => ({ tid: t, count: totals[t] }));
}

function renderSparkline(points) {
  if (points.length < 2) return '';
  const w = 280, h = 28, pad = 2;
  const max = Math.max(1, ...points.map(p => p.count));
  const xs = (i) => pad + i * (w - 2 * pad) / (points.length - 1);
  const ys = (n) => h - pad - n * (h - 2 * pad) / max;
  const path = points
    .map((p, i) => `${i === 0 ? 'M' : 'L'} ${xs(i).toFixed(1)} ${ys(p.count).toFixed(1)}`)
    .join(' ');
  return `<svg viewBox="0 0 ${w} ${h}"
              preserveAspectRatio="none" class="agg-sparkline">
    <path d="${path}" fill="none"
          stroke="var(--accent-blue)" stroke-width="1.4"/>
  </svg>`;
}

// ── Init ──

async function init() {
  await fetchTasks();
  await fetchState();
  await fetchServices();
  await fetchAggregations();
  connectWS();

  // Poll state every 2s as fallback
  setInterval(() => {
    fetchState();
    fetchServices();
    // T12: aggregations are NOT polled — they refresh on
    // 'state' events whose done-count changed.
  }, 2000);
}

init();
</script>
