[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-plan-execute"
version = "0.2.0"
description = "Automated plan-review-implement workflow for Claude Code."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rachid Chabane" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["claude_plan_execute*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
