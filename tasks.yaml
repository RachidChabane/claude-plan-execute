version: 2
defaults:
  model: opus
  effort: max
  test_command: "pytest -q"
  plans_dir: plans
  persona_file: docs/persona.md
  decisions_dir: docs/decisions
  invariants_file: docs/invariants.yaml
  gates: [tests, lint]
  task_class_models:
    feature: { model: opus,   effort: max }
    polish:  { model: sonnet, effort: medium }
    docs:    { model: sonnet, effort: medium }
  caps:
    max_minutes_per_phase: 60
    max_review_rounds: 3
    max_implement_turns: 200
    max_attempts: 3
  on_max_review_rounds: fail

phases:
  - id: foundation
    title: "Rate-limit retry + token observability"
    defaults: { task_class: feature }
  - id: ergonomics
    title: "Small ergonomic primitives"
    defaults: { task_class: feature }
  - id: progress-resume
    title: "WIP-commit + diff precomputation"
    defaults: { task_class: feature }
  - id: services-and-branches
    title: "Services + branch_per_task"
    defaults: { task_class: feature }
  - id: human-and-aggregation
    title: "Human gate + cross-task aggregation"
    defaults: { task_class: feature }
  - id: parallelism
    title: "Parallel task execution"
    defaults: { task_class: feature }
  - id: cross-task-memory
    title: "Cross-task learning via Claude Code memory"
    defaults: { task_class: feature }
  - id: documentation
    title: "v0.3 release docs + recipes"
    defaults: { task_class: docs }

tasks:
  # ── Phase: foundation ────────────────────────────────────────────────────
  - id: 1
    phase: foundation
    title: "feat: rate-limit retry with exponential backoff"
    description: |
      Closes v0.3-scope §2.15. Detect Claude-API rate-limit errors in
      subprocess stderr and retry with exponential backoff. Patterns to
      match (case-insensitive): "rate_limit_error", "429", "Anthropic
      API rate limit", "Retry-After".

      Wrap claude.run_claude body in a retry loop bounded by
      defaults.caps.max_rate_limit_retries (default 3) with
      defaults.caps.rate_limit_base_backoff_seconds (default 60).
      Backoff is base * 2^(attempt-1) — 60s / 120s / 240s for the
      default 3 retries (~7 minutes total max wait).

      Rate-limited retries are distinct from implementer_timeout. Add
      "rate_limited" to state.FAILURE_CLASSES. Update runner so when
      retries exhaust the task records a rate_limited FailureRecord
      rather than a generic failure.

      Schema: add Caps.max_rate_limit_retries: int | None and
      Caps.rate_limit_base_backoff_seconds: int | None. Add to
      KEYS_TO_AUDIT in config.py. Existing v0.2.0 task files load
      with the hardcoded defaults — no breaking change.

      Tests: cover (a) successful first-attempt path (no retry), (b)
      one rate-limit then success, (c) all retries exhausted recording
      rate_limited, (d) non-rate-limit failures NOT retried — a real
      error stays a real error and does not consume the rate-limit
      retry budget.
    key_files:
      - src/claude_plan_execute/claude.py
      - src/claude_plan_execute/state.py
      - src/claude_plan_execute/schema.py
      - src/claude_plan_execute/config.py
      - src/claude_plan_execute/runner.py
      - tests/test_runner.py
      - tests/test_schema.py
      - tests/test_resolver.py
    commit_message: "feat: rate-limit retry with exponential backoff"
    depends_on: []

  - id: 2
    phase: foundation
    title: "feat: token usage observability per-task"
    description: |
      Closes v0.3-scope §2.7 (observability slice; hard caps deferred
      to v0.4 once we have data).

      Capture token usage from the Claude CLI's JSON result event:
      input_tokens, output_tokens, cache_read_input_tokens,
      cache_creation_input_tokens. Set as side-channel on
      claude.run_claude (analogous to _last_run_subtype).

      Each run_claude call appends a row to
      {plans_dir}/task-{id}/usage.jsonl:
        {"timestamp": "...",
         "phase": "plan|review|revise|implement|gate:<name>",
         "model": "opus|sonnet|haiku",
         "input": ..., "output": ...,
         "cache_read": ..., "cache_create": ...,
         "duration_seconds": ...}

      JSONL not JSON: append-only writes survive interruption.

      On task completion, sum into state.json under
      tasks.<id>.usage_summary: { total_input_tokens,
      total_output_tokens, total_cache_read, total_cache_create,
      total_runs, duration_seconds }.

      Phase 4 gate runners MUST also append rows. ShellGate has no
      token data (its row records only duration); AgentGate captures
      the full usage event.

      Dashboard: add a Cost panel placeholder showing the rolled-up
      numbers from state.json. Real visuals (bar chart, model
      breakdown) are part of T13.

      No caps enforced. Observability only.

      Tests: assert usage.jsonl schema after a run; assert
      state.json's usage_summary sums correctly across multiple runs;
      assert no usage.jsonl is written when the CLI emits no usage
      event (older CLI versions, dry-run, etc.) — robust to absence.
    key_files:
      - src/claude_plan_execute/claude.py
      - src/claude_plan_execute/runner.py
      - src/claude_plan_execute/state.py
      - src/claude_plan_execute/dashboard/index.html
      - tests/test_runner.py
      - tests/test_state.py
    commit_message: "feat: token usage observability per task"
    depends_on: [1]

  # ── Phase: ergonomics ────────────────────────────────────────────────────
  - id: 3
    phase: ergonomics
    title: "feat: touches:<glob> when matcher with pathspec"
    description: |
      Closes v0.3-scope §2.16. Implement the touches:<glob> matcher
      in gates/__init__.py:_when_matches.

      IMPORTANT: stdlib fnmatch.fnmatch does NOT handle ** recursively
      — it treats ** as a single-component *. Verified during design.
      Add `pathspec` (MIT, no transitive deps) to pyproject.toml
      install_requires; use pathspec.PathSpec.from_lines with
      GitWildMatchPattern so gitignore-style **/foo/** globs work the
      way users expect.

      Match against task['key_files']. OR semantics: any pattern
      matching any key_file passes. To get AND, declare multiple
      gates each with one pattern.

      Update _when_matches to support OR-of-touches AND OR-of-task_class
      in the same `when` (a task matching ANY token in `when` passes).
      Currently the matcher returns True on the first matching
      predicate — preserve that and add the touches: branch alongside
      task_class:.

      Tests: cover (a) recursive ** match
      (e.g., touches:**/auth/** matches frontend/src/auth/Login.tsx),
      (b) single-component glob, (c) no key_files attribute, (d) empty
      key_files, (e) mixed when=[task_class:..., touches:**/...] where
      task_class match alone is sufficient, (f) negative match.
      Specifically lock in the recursive ** behavior — that's the bug
      the design caught.
    key_files:
      - src/claude_plan_execute/gates/__init__.py
      - pyproject.toml
      - tests/test_gates.py
    commit_message: "feat: touches:<glob> when matcher"
    depends_on: []

  - id: 4
    phase: ergonomics
    title: "feat: per-task gates_extra"
    description: |
      Closes v0.3-scope §2.21. Add gates_extra: list[str] | None = None
      to the Task Pydantic model in schema.py.

      Update runner.execute_task Phase 4 dispatch to concatenate:
        gate_names = (file_defaults.gates or []) +
                     (phase_dict.gates_extra or []) +
                     (task.gates_extra or [])

      Same additive convention as phase.defaults.gates_extra. Order
      matters for serial gates only (parallel_safe gates run together
      regardless).

      No "remove" semantics. If a project wants a task to NOT run a
      gate, restructure defaults rather than introduce subtraction —
      override-vs-add ambiguity is a debugging tax.

      Tests: cover task-only, task+phase, task+phase+project layering;
      confirm extra="forbid" still catches typos like gate_extra (no
      trailing s); confirm a typo in the gate name itself produces the
      existing "Unknown gate(s) skipped" warning (not a hard error).
    key_files:
      - src/claude_plan_execute/schema.py
      - src/claude_plan_execute/runner.py
      - tests/test_schema.py
      - tests/test_runner.py
    commit_message: "feat: per-task gates_extra"
    depends_on: [3]

  - id: 5
    phase: ergonomics
    title: "feat: --explain TASK_ID for ops visibility"
    description: |
      Closes v0.3-scope §2.20. Add --explain TASK_ID to cli.py.

      Walks the same resolver + registry path execute_task uses,
      but reports instead of running:
        - Task title
        - Phase + class (with effective model/effort and source)
        - Resolved gates list with kind and source attribution
          (defaults / phase:<id> / task / registry-builtin /
          invariants.yaml)
        - For each gate, `when` evaluation: match (showing the
          matched key_file or class) or skip (with reason)
        - services_required list (project + phase + task overlay) —
          T8 will add this; for now stub the section
        - Caps: max_implement_turns, max_minutes_per_phase, etc.
        - Effective branch (if branch_per_task is on, the rendered
          branch name) — T9 will add this; for now stub the section

      Format as readable multi-line output. Not JSON — operator
      consumption.

      Tests: verify the explainer reaches the same gate list the
      runner would compute for the same task. Use
      tests/fixtures/tasks-v2.yaml; assert specific gates appear /
      do not appear given the touches/task_class filters.

      Note: T8 and T9 will extend the explainer once those primitives
      exist. This task ships the skeleton and the gate-list /
      cap-display sections; the services and branch sections are
      placeholder strings that read "(see T8/T9)" until those land.
    key_files:
      - src/claude_plan_execute/cli.py
      - src/claude_plan_execute/runner.py
      - tests/test_runner.py
    commit_message: "feat: --explain TASK_ID for ops visibility"
    depends_on: [4]

  # ── Phase: progress-resume ───────────────────────────────────────────────
  - id: 6
    phase: progress-resume
    title: "feat: WIP-commit + progress.md resume convention"
    description: |
      Closes v0.3-scope §2.11.

      Modify prompts.build_implement_prompt to instruct chunk-sized
      commits and progress.md updates:
        1. Implement in commit-sized chunks. After each logically-
           complete chunk, run `git add -A && git commit -m
           "task-{id} WIP: <chunk-description>"`. Continue.
        2. Maintain {plans_dir}/task-{id}/progress.md with a
           checklist of items from the plan. Mark items [x] when
           done, [~] when in progress, [ ] when not started.
        3. If sensing turn budget low, commit current chunk, update
           progress.md, and finish the session cleanly.

      Add prompts.build_resume_prompt: skips Plan/Review and
      continues from progress.md. The builder must:
        - Read the existing progress.md and reproduce its checklist
          in the prompt body.
        - Run `git status --porcelain` and surface uncommitted hunks
          to the implementer (told to either commit them as the next
          chunk or revert with explanation). Without this dirty-tree
          handling, resume can clobber unfinished edits.
        - Reuse the same persona + decisions + failure-context
          composition order as the normal implement prompt.

      In runner.execute_task: detect existing
      {plans_dir}/task-{id}/progress.md with [~] or [ ] entries
      and route to the resume builder; skip Plan and Review phases
      automatically (skip_to="implement" semantics on the next run).
      All-[x] progress.md means done — log a notice and skip
      entirely; the gate phase still runs to validate.

      State entry tracks progress_path. Status stays "implementing"
      during a resume; the existence of progress.md is enough signal
      for routing. Do NOT add a "resuming" status — that complicates
      the dashboard for marginal benefit.

      Tests: (a) fresh attempt (no progress.md) builds normal prompt;
      (b) resume attempt (progress.md mid-list) builds resume prompt
      and skips earlier phases; (c) all-[x] progress means task done
      pending gates; (d) dirty-tree detection surfaces uncommitted
      hunks in the resume prompt body.
    key_files:
      - src/claude_plan_execute/prompts.py
      - src/claude_plan_execute/runner.py
      - src/claude_plan_execute/state.py
      - tests/test_prompts.py
      - tests/test_runner.py
    commit_message: "feat: WIP-commit + progress.md resume convention"
    depends_on: []

  - id: 7
    phase: progress-resume
    title: "feat: precomputed git diff for agent gates"
    description: |
      Closes v0.3-scope §2.17.

      After the implement phase, before Phase 4 gates, write the
      implementation diff to {plans_dir}/task-{id}/diff.patch.

      Diff target:
        - If branch_per_task is OFF (T9 not yet applied): use
          `git diff HEAD~1..HEAD`.
        - If branch_per_task is ON (after T9 lands and is enabled):
          `git diff origin/{base_branch}...HEAD`.
      For T7's initial implementation, compute against HEAD~1..HEAD;
      T9 patches the runner to also pass the branch context once
      branch_per_task is in scope.

      Tail-cap output at 256 KB (head-truncate, like ShellGate's
      _OUTPUT_CAP_BYTES pattern). On a no-op task (empty diff), write
      an empty diff.patch — templates handle "diff is empty, read
      source" branch.

      Update the three agent-gate templates (test-critique,
      security-auditor, design-fidelity) to reference {diff_path}.
      AgentGate substitutes {diff_path} during _load_template the
      same way it substitutes {persona} (template substitution via
      .replace() on the body).

      Tests: confirm diff.patch exists post-implement; confirm
      template substitution; confirm tail-cap on huge synthesized
      diffs; confirm empty diff handling.
    key_files:
      - src/claude_plan_execute/runner.py
      - src/claude_plan_execute/gates/agent.py
      - src/claude_plan_execute/gates/templates/test-critique.md
      - src/claude_plan_execute/gates/templates/security-auditor.md
      - src/claude_plan_execute/gates/templates/design-fidelity.md
      - tests/test_gates.py
    commit_message: "feat: precomputed diff for agent gates"
    depends_on: []

  # ── Phase: services-and-branches ─────────────────────────────────────────
  - id: 8
    phase: services-and-branches
    title: "feat: services: block + ServiceManager"
    description: |
      Closes v0.3-scope §2.3 (highest-priority confirmed gap).
      Declarative dev-server lifecycle for unattended runs.

      Schema additions:
        Top-level: services: list[ServiceSpec]
          ServiceSpec(name, command, cwd?, env={}, ready_check,
                      ready_timeout_seconds=60,
                      lifetime="run"|"phase"|"task"|"gate"
                        (default "run"),
                      log_file?, depends_on=[])
          ReadyCheck(kind="http"|"tcp"|"shell",
                     url? (for http), port? (for tcp),
                     command? (for shell))
        Defaults additions:
          services_required: list[str] | None = None
        Task additions:
          services_required_extra: list[str] | None = None
        Phase.defaults stays loose — phase-level
          services_required_extra works without further schema work,
          same convention as gates_extra.

      Implement src/claude_plan_execute/services.py with ServiceManager:
        - start(name) → spawn subprocess.Popen, run ready check up to
          ready_timeout_seconds (poll every 1s), raise on failure.
          Pipe stdout/stderr to log_file. Set process group via
          os.setsid so SIGTERM takes down child workers.
        - stop(name) → SIGTERM, then SIGKILL after 5s grace.
        - ensure(required: list[str]) → bring up listed services not
          already running, raise on any failure.
        - tear_down_for_scope(scope) → stop services whose lifetime
          matches.
        - poll_health() → check liveness; auto-restart once on crash;
          emit service_unstable after 3 consecutive crashes.

      Ready-check implementations:
        - http: GET URL, accept 2xx/3xx within timeout.
        - tcp: socket.connect((host or 127.0.0.1, port)) within timeout.
        - shell: subprocess.run(command), accept exit 0 within timeout.

      Add to FAILURE_CLASSES: service_unavailable, service_crashed,
      service_unstable.

      Runner integration:
        - cli.main() instantiates ServiceManager after loading tasks
          and computing the union of services_required across all
          tasks.
        - Before task loop: ensure(<services with lifetime=run>).
        - Inside execute_task before Phase 4: ensure(<gate-scoped>).
        - After each task / phase / run: tear_down_for_scope(...).
        - Service-startup failure → service_unavailable
          FailureRecord on the dependent task; task status="blocked".

      Server: GET /api/services returns list with status + last 200
      log lines. POST /api/services/<name>/restart restarts.
      Dashboard: new Services panel with status badges, log tail,
      restart button.

      Extend --explain (T5) to show services_required for the task —
      the section was a stub in T5.

      Tests: (a) ready-check kind=http success/timeout, (b) kind=tcp
      success/timeout, (c) kind=shell exit-0/non-zero, (d) start →
      stop → start, (e) ensure with missing service raises, (f)
      crash auto-restart, (g) lifetime=task tear-down at task end,
      (h) services_required_extra overlay (defaults ∪ phase ∪ task).
    key_files:
      - src/claude_plan_execute/schema.py
      - src/claude_plan_execute/services.py
      - src/claude_plan_execute/runner.py
      - src/claude_plan_execute/cli.py
      - src/claude_plan_execute/state.py
      - src/claude_plan_execute/server.py
      - src/claude_plan_execute/dashboard/index.html
      - tests/test_services.py
      - tests/test_schema.py
    commit_message: "feat: services: block + ServiceManager"
    depends_on: [1]

  - id: 9
    phase: services-and-branches
    title: "feat: branch_per_task + auto_pr + auto_merge"
    description: |
      Closes v0.3-scope §2.12. Per-task branches with optional PR
      creation and merge.

      Schema additions to Defaults:
        branch_per_task: bool = False (backward-compat default)
        base_branch: str = "main"
        task_branch_template: str = "task/{id}-{slug}"
        auto_pr: bool = False
        auto_merge: bool = False
        pr_body_template: str | None = None

      Slug generation: lowercase task['title'], replace non-
      alphanumeric with '-', collapse repeats. Truncate slug body to
      ~30 chars to keep branch names readable.

      Runner integration in execute_task:

      BEFORE Phase 1:
        if branch_per_task:
          subprocess.run(["git", "fetch", "origin", base_branch])
          parent_branch = (
            <branch of latest done dependency>
            if depends_on with branch_per_task tasks exist
            else f"origin/{base_branch}"
          )
          # Idempotent: re-checkout if branch exists; create otherwise.
          if branch exists locally: git checkout branch
          else: git checkout -b branch parent_branch
          state.set_status(tid, ..., branch=branch)

      AFTER Phase 4 (gates pass):
        if auto_pr:
          git push -u origin branch
          gh pr create --base base_branch \\
            --title task['title'] \\
            --body <rendered template>
          # Idempotent against an existing PR — gh returns the
          # existing URL.
          state.set_status(tid, ..., pr_url=...)
        if auto_merge:
          gh pr merge --auto --squash

      Operator hygiene (DOCS, not enforcement, in v0.3): do NOT
      merge a parent task's PR while a dependent task is in-flight
      on its branch — the dependent loses its parent base. The
      dashboard surfaces in-flight branches so the operator can see
      what to leave alone. Document in T13.

      State entry gains: branch (str), pr_url (str | None).

      Patch T7's diff target now that branch_per_task is in scope:
      when branch_per_task is on, use
      `git diff origin/{base_branch}...HEAD`. Tests in T7 file
      cover both branches; this task adjusts the runner code.

      Extend --explain (T5) to show the resolved branch name when
      branch_per_task is on.

      Dashboard: per-task panel shows branch + PR link when set.

      Decisions:
        - gh CLI required when auto_pr=true. Document install + auth
          prerequisites in T13.
        - GitLab/Forgejo deferred to v0.4.
        - Why default false? Backward compat with existing v0.2.0
          users.
        - Idempotent gh pr create: if a PR already exists, gh
          returns the existing URL with exit 0. We capture stdout to
          extract the URL.

      Tests: (a) branch_per_task=false: behavior unchanged from v0.2.0,
      (b) true: branch created from origin/main, (c) dependent task
      creates branch from parent's branch (parent must have branch
      attribute), (d) auto_pr opens PR via gh (mock the gh
      subprocess), (e) auto_merge runs the correct gh pr merge,
      (f) state entry tracks branch + pr_url, (g) idempotent
      checkout-or-create.
    key_files:
      - src/claude_plan_execute/schema.py
      - src/claude_plan_execute/runner.py
      - src/claude_plan_execute/cli.py
      - src/claude_plan_execute/state.py
      - src/claude_plan_execute/dashboard/index.html
      - tests/test_runner.py
      - tests/test_schema.py
    commit_message: "feat: branch_per_task + auto_pr + auto_merge"
    depends_on: [8]

  # ── Phase: human-and-aggregation ─────────────────────────────────────────
  - id: 10
    phase: human-and-aggregation
    title: "feat: kind: human gate primitive"
    description: |
      Closes v0.3-scope §2.4. Human-in-the-loop gate kind. Pauses
      the runner, surfaces a review prompt, resumes on operator
      decision.

      Schema (TWO Pydantic Literals must change, not one — without
      both extensions, project YAML registrations of human gates
      fail validation at load):
        - Gate.kind: Literal["shell", "agent", "human"] in
          gates/__init__.py.
        - InvariantEntry.kind: Literal["shell", "agent", "human"] in
          gates/invariants.py.
        - Gate gains sentinel_path: str | None (default
          plans/task-<id>/gates/<name>.approval).
        - Default Gate.timeout_minutes for human is 1440 (24h);
          keep 10 default for shell/agent.

      REUSE the existing prompt_template field for the human-facing
      request body — same dual path/inline semantics AgentGate
      already uses (see gates/agent.py:_load_template). Do NOT add
      a new prompt field; one field, two consumers, no drift.

      Compile-entry update in gates/invariants.py:
        - Add a 'human' branch to compile_entry that produces
          Gate(kind="human", prompt_template=entry.prompt_template,
               sentinel_path=..., timeout_minutes=...,
               parallel_safe=False, on_failure=...).
        - Split or relax _check_shell_specifiers so human entries
          with only prompt_template validate without tripping the
          shell-specifier guard.

      Implement src/claude_plan_execute/gates/human.py:
        HumanGate(name, gate, task, task_dir).run() →
          1. Load body from prompt_template (path or inline).
          2. Render to {task_dir}/gates/{name}.request.md with
             context (task title, plan path, gates dir, diff path
             from T7).
          3. Poll for {task_dir}/gates/{name}.approval (PASS) or
             .rejection (FAIL) every 10s up to timeout_minutes.
          4. Sentinel content (the user's note) becomes
             GateResult.output.
          5. Timeout → human_gate_timeout failure_class.

      Add 'awaiting_human' status to STATUSES; state.set_status
      while polling. Dashboard's existing per-task status badge
      surfaces this.

      parallel_safe=False for human gates — human attention is a
      serial resource; interleaving prompts confuses operators.

      Server endpoint: POST /api/gates/<task_id>/<name>/decision
      with body {decision: "approve"|"reject", note: str}. Touches
      the appropriate sentinel file with the note as content.

      Dashboard: when state shows awaiting_human, render
      Approve/Reject buttons in the gate-results panel that POST
      to the new endpoint.

      CLI subcommands:
        - claude-plan-execute approve TASK_ID GATE_NAME --note "..."
        - claude-plan-execute reject TASK_ID GATE_NAME --note "..."
      Both write the sentinel file directly (no server round-trip),
      so they work even with the dashboard down.

      Tests: (a) approval before timeout: passed=True, output
      contains note; (b) rejection: passed=False, output contains
      note; (c) timeout: passed=False, error="human_gate_timeout";
      (d) Pydantic compile_entry accepts kind=human with
      prompt_template only; (e) compile_entry rejects kind=human
      WITHOUT prompt_template; (f) server endpoint writes correct
      sentinel; (g) CLI approve/reject subcommands write sentinel.
    key_files:
      - src/claude_plan_execute/gates/__init__.py
      - src/claude_plan_execute/gates/invariants.py
      - src/claude_plan_execute/gates/human.py
      - src/claude_plan_execute/state.py
      - src/claude_plan_execute/server.py
      - src/claude_plan_execute/cli.py
      - src/claude_plan_execute/dashboard/index.html
      - tests/test_gates.py
      - tests/test_server.py
    commit_message: "feat: kind: human gate primitive"
    depends_on: [4]

  - id: 11
    phase: human-and-aggregation
    title: "feat: structured findings JSON output for agent gates"
    description: |
      Closes v0.3-scope §2.18. Allow agent-gate templates to emit a
      structured findings appendix the runner extracts and stores as
      a sidecar .json file. Optional emission — gates that don't emit
      it keep working unchanged.

      RISK MITIGATION (the reason this was originally out-of-scope):
      schema lock-in. The build-tool source must stay gate-agnostic
      so it doesn't grow when new gates ship with new finding shapes.
      Three rules enforce this:

        1. Permissive top-level schema. Build-tool only requires:
             a) the appendix parses as JSON;
             b) after parse, normalize to {findings: list[dict]}:
                - bare array → wrap as {findings: [...]}
                - object with `findings: list` → use as-is
                - anything else (scalar, null, list-of-non-dicts) →
                  store {findings: [], _raw: <raw string>} and
                  log warning. Don't fail the gate.
        2. NO required inner keys. NO enum constraints. NO
           type-checks beyond "is each finding a dict?".
        3. Templates own their inner shape. Per-template schema is
           documented INLINE in the template prompt — never in
           build-tool source. A new gate (project-supplied via
           invariants.yaml) emits whatever its template instructs;
           the build tool extracts whatever appears.

      Marker syntax in template output (HTML comments — invisible if
      the response is rendered as markdown):
        <!-- BEGIN_FINDINGS_JSON -->
        [ ... JSON ... ]
        <!-- END_FINDINGS_JSON -->

      Extraction in gates/agent.py:
        - After run_claude returns, regex-search the output text for
          the marker pair (greedy multiline match, only the first
          appendix is honored).
        - If absent → findings=None, no .json written. Existing v0.2
          gate templates still work.
        - If present → slice the body, json.loads it, apply the
          normalization rules above.
        - On json.loads failure: log yellow warning ("malformed
          findings JSON in <gate>; gate verdict unchanged") and
          proceed with findings=None. The text VERDICT remains the
          source of truth for pass/fail. Don't fail the gate on
          appendix problems.

      Storage:
        - {task_dir}/gates/<name>.txt: unchanged (full response).
        - NEW {task_dir}/gates/<name>.json: pretty-printed
          (indent=2) when extraction succeeds. Absent when no
          markers, when parse fails, or when the gate is shell-kind
          (only agent gates can emit; ShellGate doesn't extract).

      GateResult enrichment:
        - Add findings: list[dict] | None = None to the frozen
          dataclass.
        - Populated by AgentGate when extraction succeeds; None
          otherwise. Re-construction in run_gates (for
          output_path patching) must preserve findings.

      Update three built-in templates to emit appendices with
      per-template schemas documented in the prompt. Keep markdown
      verdict sections unchanged — appendix is additive:
        - gates/templates/security-auditor.md: emit
          {category, severity, file, line, evidence, suggested_fix}.
          Severity: free-form string; common values critical/high/
          medium/low documented in template but not enforced.
        - gates/templates/test-critique.md: emit
          {missing_test_for, contract, suggested_test_name}.
        - gates/templates/design-fidelity.md: emit
          {finding_letter, viewport, selectors, risk}. finding_letter
          is the A–F category from the existing template body.

      Each template's "## Output format" section gains a
      "Structured findings appendix (recommended)" subsection with
      the schema and one concrete example. Templates explicitly say:
      "If you cannot produce structured findings — e.g., the failure
      is a single-line cause — emit an empty `[]` or omit the
      appendix entirely. The text verdict is what blocks; the
      appendix is for aggregation."

      Schema evolution path (the lock-in escape hatch):
        - A project changes its template to add a new field (e.g.,
          confidence: float). Old gate runs don't have it. Old
          aggregations against the new field bucket missing values
          as "(unknown)" — no crash. The project updates its
          aggregations.yaml to query the new field. Done. Build-tool
          source untouched.
        - The build tool is permanently gate-agnostic.

      No state.json schema_version bump — findings live in
      sidecar .json, not in state.

      Tests: (a) extraction of well-formed JSON appendix populates
      findings; (b) bare array normalizes to {findings: [...]};
      (c) malformed JSON logs warning, findings=None, gate verdict
      unchanged; (d) missing markers → findings=None, no .json;
      (e) shell gates never produce .json; (f) GateResult.findings
      survives re-construction in run_gates; (g) non-dict elements
      in findings list rejected with warning, normalized to empty.
    key_files:
      - src/claude_plan_execute/gates/agent.py
      - src/claude_plan_execute/gates/__init__.py
      - src/claude_plan_execute/gates/templates/security-auditor.md
      - src/claude_plan_execute/gates/templates/test-critique.md
      - src/claude_plan_execute/gates/templates/design-fidelity.md
      - tests/test_gates.py
      - tests/test_gates_design_fidelity.py
    commit_message: "feat: structured findings JSON output for agent gates"
    depends_on: []

  - id: 12
    phase: human-and-aggregation
    title: "feat: cross-task gate-result aggregation panel"
    description: |
      Closes v0.3-scope §2.14. Dashboard panel showing tallies of
      recurring gate findings across the slate. Read-only post-hoc —
      re-runnable without re-running gates.

      Two query modes — project picks per aggregation:

      Mode A (regex over .txt — works on every gate):
        - name: untranslated-by-locale
          gate: untranslated-strings
          extract: "(?im)missing key: (\\S+)"

      Mode B (JSON field over .json — requires T11's structured
      output; richer queries):
        - name: security-by-severity
          gate: security-auditor
          field: severity              # extracts findings[].severity
        - name: design-by-category
          gate: design-fidelity
          field: finding_letter
        - name: security-by-category-and-severity
          gate: security-auditor
          fields: [category, severity] # composite key, joined with ":"

      Mutual exclusivity: each aggregation entry sets exactly one of
      {extract, field, fields}. Loader rejects "both" or "neither"
      with a clear message.

      Server endpoint: GET /api/aggregate/<aggregation-name>
        - Walks {plans_dir}/task-*/gates/.
        - Mode A: reads <gate>.txt, applies regex, captures group 1
          (or full match if no group).
        - Mode B (field/fields): reads <gate>.json, iterates
          findings[], extracts the field(s). Missing field →
          finding bucketed as "(unknown)". Findings without the
          requested field count toward "(unknown)" but don't crash.
        - Returns rows of {finding, total_count, per_task: {task_id:
          count}} sorted by total_count descending.

      aggregations.yaml lives outside the tasks-file schema —
      dashboard-only. Server validates at request time. Bad regex
      OR malformed yaml → 500 with helpful message. Missing
      .json file (gate didn't emit appendix) → silently skip that
      task in field-mode aggregation; the regex-mode fallback path
      stays via .txt.

      Dashboard: new Aggregations panel with one card per
      configured aggregation. Each card shows top-N findings as a
      bar list with task-id breakdown on hover. Sparkline of
      finding count vs task ID (ascending) gives the trend.

      Tests: (a) endpoint walks task dirs correctly, (b) Mode A
      regex extracts from gate output text, (c) Mode B reads .json
      and iterates findings[], (d) Mode B with missing field
      buckets as "(unknown)", (e) Mode B composite `fields`
      produces "ACL:critical"-style joined keys, (f) per-task count
      and total align, (g) missing gate dir silently skipped, (h)
      bad regex returns 500, (i) both extract and field set
      returns 400.
    key_files:
      - src/claude_plan_execute/server.py
      - src/claude_plan_execute/dashboard/index.html
      - tests/test_server.py
    commit_message: "feat: cross-task gate-result aggregation"
    depends_on: [11]

  # ── Phase: parallelism ───────────────────────────────────────────────────
  - id: 13
    phase: parallelism
    title: "feat: parallel task execution with key_files contention guard"
    description: |
      Closes v0.3-scope §2.5. Allow multiple tasks to run
      concurrently when independent AND not sharing key_files. Opt-in
      via defaults.parallelism: int (default 1 = current behavior).

      Schema additions:
        Defaults.parallelism: int = 1

      Schema-level interlock (loader-rejected, NOT runtime-rejected):
        If defaults.parallelism > 1 AND defaults.branch_per_task is
        false, raise a ValidationError at load time with a clear
        message:
          "parallelism > 1 requires branch_per_task: true; parallel
           commits to a single branch race and lose work."
        Implement in TasksFile model_validator(mode='after').

      Eligibility predicate (in runner): a task is eligible to start
      when ALL of:
        - All depends_on tasks have status=done.
        - No in-flight task shares any path in key_files.
        - All required services for this task are up (T8 manager).

      Scheduler: replace cli.main()'s sequential
      `for task in ordered_tasks` with a worker pool.
        - ThreadPoolExecutor(max_workers=parallelism).
        - Workers loop: pick next eligible task, run execute_task,
          repeat until no eligible tasks AND no in-flight tasks.
        - State.save() must remain atomic (it already uses tempfile
          + rename — preserve that).
        - Eligibility re-checked after each task completion.

      Branch isolation: parallel tasks each work on their own branch
      (T9 branch_per_task). The interlock above enforces this.

      Service contention:
        - Services with lifetime=task: each parallel worker entering
          a task starts its own instance. Project must use distinct
          ports / dirs. T8's ServiceManager scopes log_file paths
          per (service, task_id) when lifetime=task.
        - Services with lifetime=run: shared across workers (the
          ManagerEnsureRequest is idempotent — already-up = no-op).

      Rate-limit contention: parallelism multiplies the rate at
      which we hit Anthropic API caps. T1's retry wrapper absorbs
      short bursts. Document the recommendation in T13: start with
      parallelism=2, scale up only if rate-limit retries are rare
      in observed runs.

      Dashboard: change task panel from "single in-flight panel" to
      "N concurrent panels" with separate log streams per worker.
      WebSocket broadcast tags each event with worker_id. The
      Services panel from T8 stays singular (services are shared).

      Decisions:
        - Why ThreadPoolExecutor not multiprocessing? Runner is
          I/O-bound (subprocess + git + filesystem). Threads share
          State + log multiplexing for free. Subprocess child
          processes are isolated regardless.
        - Why key_files contention check, not actual git diff?
          Same as touches:<glob> rationale — declared intent beats
          dynamic detection, and it's check-able BEFORE running the
          task.
        - Why interlock at load, not runtime? Better failure mode —
          the user sees the error before any work runs.

      Tests: (a) parallelism=1 behaves identically to v0.2.0,
      (b) parallelism=2 runs two independent tasks concurrently,
      (c) eligibility predicate blocks a third task when two share
      key_files, (d) parallelism>1 + branch_per_task=false raises
      ValidationError at load, (e) failure on one worker doesn't
      kill others, (f) state.json updates atomically across workers
      under contention (use threading.Lock around save() if not
      already).
    key_files:
      - src/claude_plan_execute/runner.py
      - src/claude_plan_execute/cli.py
      - src/claude_plan_execute/schema.py
      - src/claude_plan_execute/loader.py
      - src/claude_plan_execute/state.py
      - src/claude_plan_execute/server.py
      - src/claude_plan_execute/dashboard/index.html
      - tests/test_runner.py
      - tests/test_schema.py
    commit_message: "feat: parallel task execution with key_files contention guard"
    depends_on: [8, 9]

  # ── Phase: cross-task-memory ─────────────────────────────────────────────
  - id: 15
    phase: cross-task-memory
    title: "feat: prompt agents to read/write Claude Code memory + lifecycle + citations"
    description: |
      Cross-task learning via the Claude Code agent's existing
      auto-memory system. Plus two pruning hooks that prevent
      MEMORY.md from ballooning indefinitely:
        - Tier 1: type-aware lifecycle metadata on each memory.
        - Tier 3: citation tracking — planner marks which memories
          drove decisions; runner increments per-memory counters.
      The heavy curation work (Tier 2: AI-driven prune of stale
      entries) ships separately as a gate in T16.

      WHY THE MECHANISM (do not duplicate it):
        Each `claude -p ...` subprocess the runner spawns is a fresh
        Claude Code session in the project directory. Claude Code
        auto-loads `<project>/.claude/projects/<encoded-path>/memory/
        MEMORY.md` at session start. Task N's implementer can write
        memory entries; Task N+1's planner inherits them via the
        auto-load. No new YAML key, no new loader, no new prompt
        overlay, no new file in the project root.

      WHAT TO ADD (prompt instructions):
        Modify three prompt builders in
        src/claude_plan_execute/prompts.py:

        1. build_plan_prompt — add a "## Memory" section after the
           decisions block and before the body, instructing the
           planner to:
            (a) consult its loaded MEMORY.md (especially memory
                types `feedback` and `project`) BEFORE planning;
            (b) incorporate any learnings that bear on this task;
            (c) when a memory drives a step in the plan, ANNOTATE
                that step with `[MEM: <memory_name>]` so the
                runner can later count citations (Tier 3).

        2. build_review_prompt — same memory section. Reviewer
           flags plans that contradict accepted learnings ("the
           plan does X, but memory entry feedback_pydantic_v2
           says Y") and verifies that any [MEM: ...] citations
           in the plan reference real, currently-live memory
           entries (no hallucinated names).

        3. build_implement_prompt — same memory section, PLUS:
            (a) "If during this implementation you discover a
                non-obvious pitfall, gotcha, or trick worth saving
                for future tasks — save it as a memory using the
                standard Claude Code pattern."
            (b) FRONTMATTER REQUIRED on every new memory. Schema:
                  ---
                  name: <slug>
                  description: <one-line — used to decide relevance>
                  type: user|feedback|project|reference
                  lifecycle: evergreen | slate:<slate-id> | task:<id>
                  citation_count: 0
                  ---
            (c) DEFAULT LIFECYCLE BY TYPE (Tier 1):
                  - type=project   → lifecycle: slate:<current-slate-id>
                                     (auto-pruned when slate ends)
                  - type=feedback  → lifecycle: evergreen
                  - type=reference → lifecycle: evergreen
                  - type=user      → lifecycle: evergreen
                The implementer can override default → explicit value
                if it knows better (e.g., a feedback memory about a
                bug that's being fixed in a later task → set
                lifecycle: task:<id> so it's pruned once that task
                lands).
            (d) HOW TO FIND THE SLATE ID: the runner exposes it via
                env var CLAUDE_PLAN_EXECUTE_SLATE_ID set on every
                claude subprocess (passed through ServiceManager-
                style; for now, derive from
                `git rev-parse --abbrev-ref HEAD` for branch-based
                slates, or fall back to the file mtime of
                tasks.yaml if no branch context).
            (e) TERSENESS BUDGET: title ≤ 60 chars, body ≤ 5 lines.
            (f) DO NOT SAVE: trivia, restated persona.md content,
                project-state recap of what just changed in code
                (that belongs in commit messages, not memory).

      WHAT TO ADD (runner: lifecycle pruning + citation tracking):
        In src/claude_plan_execute/runner.py, after a successful
        gate phase, add two passes (both small, ~50 lines total):

        1. Lifecycle prune. Walk the project's memory directory
           (path computed from cwd via the same scheme Claude Code
           uses: ~/.claude/projects/<encoded-cwd>/memory/). For each
           per-memory file, parse frontmatter. If
           `lifecycle: task:<N>` and task N is now `done`, delete
           the file and remove its line from MEMORY.md. Same for
           `lifecycle: slate:<id>` once the slate is `ALL TASKS
           COMPLETE`. Idempotent: safe to re-run; no-op if nothing
           expired.

        2. Citation count. After each task's implementer commits,
           grep its plan.md for `[MEM: <name>]` patterns. For each
           cited name, increment `citation_count` in that memory's
           frontmatter. Citations across plans accrete; this is
           the signal Tier 2's curation gate (T16) will use to
           decide which memories to drop.

      THE FOUR PROMPT-OVERLAY LAYERS (document in the prompt body
      so the agent picks the right one):
        - persona.md (you, hand-curated): stable conventions.
        - docs/decisions/ (you, hand-curated): ADR-style
          architectural choices.
        - MEMORY.md + per-memory files (agent, auto-curated):
          tactical pitfalls discovered in flight.
        - failure_context (runner-injected): per-attempt prior
          failure verbatim.

      COMPOSITION ORDER unchanged: failure_context + persona +
      decisions + body. The "## Memory" section we ADD per phase
      lives INSIDE the body — it's instructions, not an injected
      fragment. The Claude CLI auto-loads MEMORY.md itself.

      OUT OF SCOPE for T15 (lands in T16):
        - The actual AI curation gate that drops zero-citation /
          stale memories beyond the type-aware defaults. T16
          implements this as a registered agent gate.

      Tests in tests/test_prompts.py + tests/test_runner.py:
        (a) build_plan_prompt body contains the "## Memory" section
            with the [MEM: ...] citation directive.
        (b) build_review_prompt body contains the same section
            plus the "verify cited names exist" directive.
        (c) build_implement_prompt body contains the four-layer
            taxonomy, the frontmatter schema, the type-aware
            default lifecycles, and the don't-save list.
        (d) Composition order unchanged.
        (e) Runner lifecycle prune: a memory with
            lifecycle: task:5 is deleted when task 5 transitions
            to done. lifecycle: slate:foo is deleted when slate
            ends. evergreen entries are never auto-deleted.
        (f) Runner citation count: a plan.md containing
            [MEM: foo_lesson] increments foo_lesson's
            citation_count by 1. Multiple references in the same
            plan count multiple times. References to nonexistent
            memories are silently ignored (the reviewer caught
            them; the runner doesn't double-fault).
    key_files:
      - src/claude_plan_execute/prompts.py
      - src/claude_plan_execute/runner.py
      - tests/test_prompts.py
      - tests/test_runner.py
    commit_message: "feat: prompt agents to read/write Claude Code memory + lifecycle + citations"
    depends_on: []

  - id: 16
    phase: cross-task-memory
    title: "feat: memory-curate agent gate for AI-driven pruning"
    description: |
      The pruning policy completion. T15 ships type-aware lifecycle
      auto-deletion and citation tracking; T16 ships the gate that
      uses those signals plus codebase verification to drop stale
      memories the lifecycle rules wouldn't catch.

      WHEN IT RUNS:
        Triggered automatically when MEMORY.md crosses
        defaults.memory_curation_threshold entries (default 30,
        configurable). The runner detects the threshold at the end
        of each task's gate phase and APPENDS `memory-curate` to
        the next task's resolved gate list. Single-shot trigger —
        once it runs, the threshold is re-evaluated against the
        post-curation count.

      Schema additions:
        Defaults.memory_curation_threshold: int = 30
        Add to KEYS_TO_AUDIT in config.py.

      THE GATE:
        Built-in agent gate registered on default_registry() at
        module import time (alongside test-critique and
        security-auditor). Sonnet/medium, parallel_safe=False
        (mutates the filesystem). Block-on-fail=False — a
        curation failure shouldn't block the implementing task;
        it just leaves MEMORY.md as-is and surfaces a warning.

      Template at gates/templates/memory-curate.md instructs:
        1. Read MEMORY.md and every per-memory file.
        2. For each memory, verify against the current codebase:
           - Is the premise still true? (Read referenced files.)
           - Is the lesson actionable now, or did a refactor
             obviate it?
           - Is it non-obvious? (Or has it become trivially
             true / standard practice?)
           - Is its citation_count meaningful given how many tasks
             have run since it was written? Zero citations after
             K tasks is a drop signal but not a guarantee — some
             evergreen lessons never need citing because they're
             baked into how subsequent plans are written.
        3. Output a JSON appendix (T11's structured-findings format,
           reuse the marker convention):
             <!-- BEGIN_FINDINGS_JSON -->
             [
               {"memory": "name1", "verdict": "keep",
                "reason": "still relevant; cited in 3 plans"},
               {"memory": "name2", "verdict": "drop",
                "reason": "premise was 'pydantic v2 silently...';
                          fixed in T8; lesson no longer applies"},
               {"memory": "name3", "verdict": "merge_into:name1",
                "reason": "duplicate of name1's lesson"}
             ]
             <!-- END_FINDINGS_JSON -->

      RUNNER POST-PROCESSING:
        - keep: no action.
        - drop: delete the per-memory file, remove the line from
          MEMORY.md.
        - merge_into:<other>: NEVER auto-applied. The runner
          surfaces these in the dashboard for one-click human
          review (or via a CLI subcommand
          `claude-plan-execute memory merge-suggestions`). Merges
          are content-aware; an automated merge could lose nuance.
          Until human-applied, both memories remain.

      DASHBOARD:
        New surface in the existing gates panel — when memory-curate
        runs, show the keep/drop/merge counts and the merge
        suggestions with Accept/Decline buttons (POST endpoint
        applies the merge). Out of scope: rich-diff view of merge
        results — display the two memories' bodies side by side
        and let the operator decide.

      INTERACTION WITH T15:
        T15's lifecycle prune runs at every task boundary (cheap,
        deterministic). T16's curation gate runs only when the
        threshold is hit (expensive — agent invocation). The two
        compose: lifecycle handles the cases the prompt could
        predict at write time; curation handles the cases that
        only become visible later.

      OUT OF SCOPE (defer to v0.4):
        - Manual `claude-plan-execute memory prune --interactive`
          subcommand. Tier-4 escape hatch; not load-bearing while
          T15+T16 cover the common cases.
        - Cross-PROJECT memory merging.

      Tests in tests/test_gates.py + tests/test_runner.py:
        (a) Gate registers on default_registry() at import time.
        (b) Threshold-detection logic: when MEMORY.md has 31 entries,
            the next task's gate list gains 'memory-curate'; when it
            has 29, it does not.
        (c) Runner applies keep/drop verdicts correctly; merge
            suggestions are NOT applied automatically.
        (d) Malformed JSON output: log warning, leave memories
            as-is (same fail-soft pattern as T11).
        (e) The threshold setting is resolver-aware (per-task and
            per-phase override possible).
    key_files:
      - src/claude_plan_execute/gates/__init__.py
      - src/claude_plan_execute/gates/builtin.py
      - src/claude_plan_execute/gates/templates/memory-curate.md
      - src/claude_plan_execute/runner.py
      - src/claude_plan_execute/schema.py
      - src/claude_plan_execute/config.py
      - src/claude_plan_execute/server.py
      - src/claude_plan_execute/dashboard/index.html
      - tests/test_gates.py
      - tests/test_runner.py
      - tests/test_schema.py
    commit_message: "feat: memory-curate agent gate for AI-driven memory pruning"
    depends_on: [11, 15]

